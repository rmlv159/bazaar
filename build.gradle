plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.5'
	id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.r'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
	mavenLocal()
}

configurations {
	jaxb
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//	implementation 'org.springframework.security:spring-security-core'
//	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.3'
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.15.2'

//	//needed for xml writing
	implementation group: 'org.eclipse.persistence', 	name: 'javax.persistence', 				version: '2.1.0'
	implementation group: 'org.eclipse.persistence', 	name: 'org.eclipse.persistence.moxy', 	version: '2.7.7'
	implementation group: 'javax.xml.bind', 			name: 'jaxb-api', 						version: '2.3.1'
	implementation group: 'org.glassfish.jaxb',			name: 'jaxb-runtime', 					version: '4.0.4'
	implementation group: 'jakarta.xml.bind', 			name: 'jakarta.xml.bind-api', 			version: '4.0.0'
	implementation group: 'jakarta.activation', 		name: 'jakarta.activation-api', 		version: '2.1.2'

	jaxb 'com.sun.xml.bind:jaxb-xjc:4.0.4'
	jaxb 'javax.xml.bind:jaxb-api:2.3.1'
	jaxb 'org.glassfish.jaxb:jaxb-runtime:4.0.4'

	implementation group:'com.r', name: 'bazaar-lib', version: '0.0.1-SNAPSHOT'
}

tasks.named('test') {
	useJUnitPlatform()
}

//https://github.com/rackerlabs/gradle-jaxb-plugin/blob/master/examples/hello-world-schema/hello-world-schema.gradle
task xjc(type: JavaExec) {
	main = 'com.sun.tools.xjc.XJCFacade'
	classpath configurations.jaxb
	version = 'v1'
	args = [
			'-d', 'src/main/java',
			'-p', 'com.r.bazaar.entity.schema.' + version,
			'src/main/resources/schema/v1/Danish_SAF-T_Financial_Schema_v_1_0.xsd']
}